kind = "web"
previewPath = "/"
title = "Enterprise ERP"
version = "1.0.0"
id = "artifacts/erp-frontend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22123

[services.development]
run = "pnpm --filter @workspace/erp-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp-frontend", "run", "build" ]
serve = "static"
publicDir = "artifacts/erp-frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22123"
BASE_PATH = "/"
